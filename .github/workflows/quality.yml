name: quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node: ["22.23.4", "24.22.1"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Reject an unsafe Node runtime before dependencies
        run: node scripts/check-node-security-floor.mjs
      - run: node --test scripts/check-node-security-floor.test.mjs
      - run: npm ci --ignore-scripts
      - run: npm test
