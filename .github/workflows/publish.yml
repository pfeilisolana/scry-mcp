name: publish

# Trusted Publishing (OIDC) — no NODE_AUTH_TOKEN anywhere, npm >= 11.5.1.
# Trigger: publish a GitHub Release (or run manually) after bumping versions
# in package.json AND server.json (2x). Provenance attaches automatically.

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
          registry-url: https://registry.npmjs.org
      - name: Reject an unsafe Node runtime before dependencies
        run: node scripts/check-node-security-floor.mjs
      - run: node --test scripts/check-node-security-floor.test.mjs
      - run: npm install -g npm@latest
      - run: npm ci
      - run: node --check index.mjs
      - run: node smoke.mjs
      - run: node adversarial.mjs
      # Provenance is generated from the GitHub OIDC id-token (id-token: write above),
      # independent of the auth method. NPM_TOKEN (granular, publish scope) authenticates
      # the first-ever publish of this new package; later releases can switch to tokenless
      # trusted publishing once configured on npmjs.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
